name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build DMG & Create Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Package DMG
        run: |
          chmod +x DMG-BuildandPackage.sh
          ./DMG-BuildandPackage.sh

      - name: Extract Release Notes from CHANGELOG
        run: |
          awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > release_notes.md
          cat release_notes.md
          # Extract the ### title line (e.g. ### 🎶 "Wilhelm Screamed...")
          RELEASE_TITLE=$(grep -m1 '^### ' release_notes.md | sed 's/^### //')
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RememberMyWindows.dmg
          body_path: release_notes.md
          name: ${{ env.RELEASE_TITLE }}
