name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build DMG & Create Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Package DMG
        run: |
          chmod +x DMG-BuildandPackage.sh
          ./DMG-BuildandPackage.sh

      - name: Extract Release Notes from CHANGELOG
        run: |
          awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > release_notes.md
          cat release_notes.md
          # Extract version number from changelog header (e.g. [v13.2] -> v13.2)
          APP_VERSION=$(grep -E '^## \[[vV]?[0-9]+(\.[0-9]+)*\]' CHANGELOG.md | head -n 1 | sed -E 's/.*\[[vV]?([^]]+)\].*/\1/')
          TAG_NAME="v${APP_VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          # Use delimiter syntax so quotes/emojis in the title don't break the env var
          RELEASE_TITLE=$(grep -m1 '^### ' release_notes.md | sed 's/^### //')
          echo "RELEASE_TITLE<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_TITLE"     >> $GITHUB_ENV
          echo "EOF"                >> $GITHUB_ENV

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RememberMyWindows.dmg
          body_path: release_notes.md
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.TAG_NAME }}

      - name: Ensure release title is set (handles pre-existing releases)
        run: |
          gh release edit "$TAG_NAME" --title "$RELEASE_TITLE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG_NAME }}
          RELEASE_TITLE: ${{ env.RELEASE_TITLE }}